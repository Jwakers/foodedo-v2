name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Non-deliverable form ID; browser tests intercept every Formspree request.
      FORMSPREE_FORM_ID: contacttest
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:convex
      - run: node scripts/audit-shopping-list-example.mjs
      - run: pnpm build:ios:web
      - run: node scripts/check-blog-build.mjs native
      - run: node scripts/check-public-pages-build.mjs native
      - run: node scripts/check-public-recipes-build.mjs native
      - run: pnpm build
      - run: node scripts/check-blog-build.mjs web
      - run: node scripts/check-public-pages-build.mjs web
      - run: node scripts/check-public-recipes-build.mjs web
      - run: node scripts/test-public-recipes-cache.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
