<!doctype html>
<html lang="en">
  <head>
    <title>Braised Garlic Butter Meatballs</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Braised Garlic Butter Meatballs",
        "author": { "@type": "Person", "name": "Tieghan Gerard" },
        "recipeYield": "6 servings",
        "prepTime": "PT20M",
        "cookTime": "PT35M",
        "recipeIngredient": [
          "1 1/2 pounds ground chicken, pork, or turkey",
          "1 tablespoon Italian seasoning ((see note))",
          "1 teaspoon Dijon mustard",
          "1/2 cup grated parmesan",
          "1 shallot, chopped",
          "2 cloves garlic, chopped",
          "kosher salt and black pepper",
          "2 tablespoons extra virgin olive oil",
          "6 tablespoons salted butter",
          "1 lemon, sliced",
          "1 cup dry white wine or chicken broth",
          "2 cups fresh baby spinach",
          "1/2 cup heavy cream",
          "1 tablespoon chopped fresh parsley"
        ],
        "recipeInstructions": [
          {
            "@type": "HowToSection",
            "name": "Stove Top",
            "itemListElement": [
              {
                "@type": "HowToStep",
                "text": "1. Mix and shape the meatballs. 2. Brown the meatballs in olive oil. 3. Add the butter, lemon, and shallot. 4. Pour in the wine and simmer. 5. Add the spinach and cream. 6. Return the meatballs and serve."
              }
            ]
          },
          {
            "@type": "HowToSection",
            "name": "Crockpot",
            "itemListElement": [
              {
                "@type": "HowToStep",
                "text": "1. Mix and shape the meatballs. 2. Add the meatballs to the crockpot. 3. Add the butter, lemon, and shallot. 4. Pour in the wine. 5. Cook for 1–2 hours on high or 3–4 hours on low. 6. Add the spinach and cream, then serve."
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <main>
      <article>
        <h1>Braised Garlic Butter Meatballs</h1>
        <section class="recipe-notes">
          <p>
            Italian seasoning: use a blend of basil, oregano, thyme, rosemary,
            and sage.
          </p>
        </section>
      </article>
    </main>
  </body>
</html>
