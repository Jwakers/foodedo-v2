<!doctype html>
<html>
  <head>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Tomato tofu",
        "recipeYield": "2 servings",
        "recipeIngredient": [
          "200 g firm tofu",
          "1 tbsp oil",
          "200 g chopped tomatoes",
          "Salt to taste"
        ],
        "recipeInstructions": [
          {
            "@type": "HowToStep",
            "text": "Pat 200 g firm tofu dry for 1 minute, then cut into slices."
          },
          {
            "@type": "HowToStep",
            "text": "Heat 1 tbsp oil in a frying pan. Fry the tofu for 30 seconds per side until golden."
          },
          {
            "@type": "HowToStep",
            "text": "Add 200 g chopped tomatoes and simmer for 10–15 minutes until thickened."
          },
          {
            "@type": "HowToStep",
            "text": "Remove from the heat and rest as directed in note 1. Note 1: Rest for 2 minutes before serving."
          },
          {
            "@type": "HowToStep",
            "text": "Season with salt to taste and serve."
          }
        ],
        "description": "Note 1: Rest for 2 minutes before serving."
      }
    </script>
  </head>
  <body>
    <h1>Tomato tofu</h1>
  </body>
</html>
