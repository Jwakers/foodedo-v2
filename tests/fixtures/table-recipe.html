<!doctype html>
<html>
  <body>
    <article>
      <h1>Roasted carrots</h1>
      <h2>Ingredients</h2>
      <table>
        <tr>
          <td>2</td>
          <td>carrots</td>
        </tr>
        <tr>
          <td>1 tbsp</td>
          <td>olive oil</td>
        </tr>
      </table>
      <h2>Method</h2>
      <p>
        Peel and slice the carrots. Toss with oil and roast at 200C for 25
        minutes. Serve.
      </p>
    </article>
  </body>
</html>
