<!doctype html>
<html>
  <body>
    <article>
      <h1>Carrot soup</h1>
      <a id="recipe"></a>
      <h2>Ingredients</h2>
      <ul>
        <li>2 carrots</li>
        <li>500 ml vegetable stock</li>
      </ul>
      <h2>Method</h2>
      <p>
        Peel and chop the carrots. Simmer in the stock for 20 minutes, then
        blend and serve.
      </p>
    </article>
  </body>
</html>
