    />

        "@graph": [
          { "@type": "Person", "@id": "#author", "name": "Nagi" },

            "@type": "Recipe",
            "name": "My go-to Chicken Breast recipe",
            "author": { "@id": "#author" },
            "recipeYield": ["4"],
            "prepTime": "PT5M",
            "cookTime": "PT7M",
            "recipeIngredient": [
              "2 large chicken breasts , 200 – 250g / 7 – 9oz each (Note 1)",
              "20g / 1 1/2 tbsp unsalted butter",
              "2 garlic cloves"
            ],
            "recipeInstructions": [
              {
                "@type": "HowToSection",
                "name": "ABBREVIATED",
                "itemListElement": [{ "text": "Season then cook the chicken." }]

              {
                "@type": "HowToSection",
                "name": "FULL RECIPE",
                "itemListElement": [
                  { "text": "Pound the chicken." },

  <body>
    <main>
      <div class="wprm-recipe-ingredient-group">
        <h3 class="wprm-recipe-group-name">Savoury seasoned crust</h3>
        <div class="wprm-recipe-ingredient">
          2 large chicken breasts, 200–250g / 7–9oz each (Note 1)
        </div>
      </div>
      <div class="wprm-recipe-ingredient-group">
        <h3 class="wprm-recipe-group-name">Butter sauce</h3>
        <div class="wprm-recipe-ingredient">
          20g / 1 1/2 tbsp unsalted butter
        </div>
        <div class="wprm-recipe-ingredient">2 garlic cloves</div>
      </div>
      <div class="wprm-recipe-notes">
        <span style="display: block"
          ><strong>1. Chicken</strong> – use evenly sized breasts.</span
        >
        <span style="display: block"
          ><strong>2. Flour</strong> – plain flour works best.</span
        >
        <span style="display: block"
          ><strong>3. Wine</strong> – use a dry white wine.</span
        >
        <span style="display: block"
          ><strong>4. Sauce amount</strong> – this is a quick pan sauce.</span
        >
      </div>
